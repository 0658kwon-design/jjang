@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#8fb4ff;--bg:#0c1426;--card:#16213a;--text:#e8edf8;--line:#2a3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#8fb4ff;--bg:#0c1426;--card:#16213a;--text:#e8edf8;--line:#2a3a5c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Noto Sans JP","Noto Sans SC","Noto Sans TC","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","PingFang SC","PingFang TC",sans-serif;line-height:1.6}
header{background:var(--navy);color:#fff;padding:12px 16px}
:root[data-theme="dark"] header,:root:not([data-theme="light"]) header{}
.top{max-width:900px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:.5px;font-size:18px}.logo span{color:var(--pink)}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{border:1px solid #ffffff88;background:transparent;color:#fff;border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer}
.langs button.on{background:var(--pink);border-color:var(--pink)}
nav{max-width:900px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto}
nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;white-space:nowrap;background:#ffffff1f}
nav a.on{background:#fff;color:#0b2a6f;font-weight:700}
main{max-width:900px;margin:auto;padding:20px 16px 40px}
.view{display:none}.view.on{display:block}
h1{font-size:clamp(30px,8vw,52px);line-height:1.1;margin:8px 0;color:var(--navy);font-weight:900}
h2{font-size:26px;color:var(--navy);margin:0 0 16px}
.slogan{color:var(--pink);font-weight:800;letter-spacing:2px;font-size:18px}
.badge{display:inline-block;background:var(--sky);color:#06214d;font-weight:800;border-radius:8px;padding:6px 12px;margin:10px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.ph{border:2px dashed var(--sky);border-radius:16px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--navy);padding:12px;margin:12px 0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn{background:var(--pink);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 18px;border:0;font-size:16px;cursor:pointer}
.btn.alt{background:var(--navy);color:var(--bg)}
.step{display:flex;gap:14px;align-items:center}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.ico{font-size:28px;margin-left:auto}
.price{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price b{font-size:clamp(28px,8vw,40px);color:var(--navy)}.price span{font-size:20px;font-weight:700}
.note{font-size:14px;opacity:.8}
.row{display:flex;flex-direction:column;padding:10px 0;border-bottom:1px solid var(--line)}.row small{opacity:.7}
.back{display:inline-block;margin-top:20px;color:var(--navy);font-weight:700}
.gal #gimg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;display:block;margin:12px 0 6px}.thumbs{display:flex;gap:6px;margin-bottom:12px}.thumbs img{width:25%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
footer{text-align:center;font-size:13px;opacity:.7;padding:20px}
</style>
